[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skills-hub-cli"
version = "0.3.0"
description = "Skillery CLI — клиент для приватного маркетплейса AI-skills."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Dmitry" }]
dependencies = [
    "typer>=0.15",
    "httpx>=0.28",
    "rich>=13.9",
    "tomli-w>=1.0",
    "keyring>=25.0",
    "pydantic>=2.9",
    "pathspec>=0.12.0",
    "s-librarykit>=0.1.4",
    "s-clikit>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[project.scripts]
skills-hub = "skills_hub_cli.__main__:app"

[tool.hatch.build.targets.wheel]
packages = ["src/skills_hub_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
