[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillery-cli"
version = "0.3.1"
description = "Skillery CLI — клиент для приватного маркетплейса AI-skills."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Dmitry" }]
dependencies = [
    "typer>=0.15",
    "httpx>=0.28",
    "rich>=13.9",
    "tomli-w>=1.0",
    "keyring>=25.0",
    "pydantic>=2.9",
    "pathspec>=0.12.0",
    "s-librarykit>=0.1.4",
    "s-clikit>=0.1.4",
    "s-skillkit>=0.1.6",
]

# Все киты (s-librarykit/s-clikit/s-skillkit) тянутся с PyPI — CLI распространяем
# без локальных path-источников. s-skillkit>=0.1.5 несёт SkillkitConfig/configure
# (единая брендо-конфигурация: core/_kit_config задаёт бренд skillery одним
# вызовом — .skillery/skills.toml + legacy .skills-hub fallback). Заодно >=0.1.2
# гард BUG-3 (#272): пустой files-инвентарь не затирает стор при auto-update.

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[project.scripts]
skillery = "skills_hub_cli.__main__:app"
# Старое имя — deprecation-shim: печатает «используйте skillery» и выходит (код 2).
skills-hub = "skills_hub_cli._deprecated_alias:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skills_hub_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
