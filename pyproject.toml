[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillery-cli"
version = "0.5.44"
description = "Skillery CLI — клиент маркетплейса AI-навыков для агентов (Claude Code, Codex)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dmitry" }]
keywords = ["skillery", "ai", "skills", "claude-code", "codex", "cli"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]
dependencies = [
    "typer>=0.15",
    "httpx>=0.28",
    "rich>=13.9",
    "tomli-w>=1.0",
    "keyring>=25.0",
    "pydantic>=2.9",
    "pathspec>=0.12.0",
    "s-librarykit>=0.1.4",
    "s-clikit>=0.1.4",
    "s-skillkit>=0.2.2",
    "s-skillgate>=0.1.2",  # единый secret-scan (G5): regex-fallback publish-гейта на skillgate
]

# Все киты (s-librarykit/s-clikit/s-skillkit) тянутся с PyPI — CLI распространяем
# без локальных path-источников. s-skillkit>=0.1.5 несёт SkillkitConfig/configure
# (единая брендо-конфигурация: core/_kit_config задаёт бренд skillery одним
# вызовом — .skillery/skills.toml + legacy .skills-hub fallback). Заодно >=0.1.2
# гард BUG-3 (#272): пустой files-инвентарь не затирает стор при auto-update.

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[project.scripts]
skillery = "skillery_cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skillery_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
