[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillery-cli"
version = "0.5.87"
description = "Skillery CLI — клиент маркетплейса AI-навыков для агентов (Claude Code, Codex)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dmitry" }]
keywords = ["skillery", "ai", "skills", "claude-code", "codex", "cli"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]
dependencies = [
    "typer>=0.15",
    "httpx>=0.28",
    "rich>=13.9",
    "tomli-w>=1.0",
    "keyring>=25.0",
    "pathspec>=0.12.0",
    # >=0.7.1 — модуль librarykit.proc (единая политика запуска подпроцессов:
    # на win32 ВСЕГДА CREATE_NO_WINDOW, обязательный timeout, stdin=DEVNULL).
    # Без него всплывали консольные окна uv/powershell при фоновой установке (#1144).
    "s-librarykit>=0.7.1,<0.9",
    # Прямая зависимость, хотя netkit приезжает и транзитивно через librarykit:
    # транспорт SSE импортирует ``netkit.sse``/``netkit.transport`` ЯВНО, а то,
    # что импортируешь сам, обязано быть объявлено — иначе смена внутренностей
    # librarykit молча уносит модуль из окружения. 0.1.0 — версия, где появились
    # `netkit.sse` (разбор/рендер кадров) и `HttpClient.stream`.
    "s-netkit>=0.1.1,<0.2",
    # Базовый кит: из него берётся тип сетевой беды netkit-потока
    # (``corekit.errors.TransportError``) — импортируем прямо, значит объявляем.
    # >=0.1.0 — `corekit.config` (кит-волна 5, #2710): движок typed-конфигов
    # без pydantic, на нём теперь построен `clikit.config.AppConfig`.
    "s-corekit>=0.1.0,<0.2",
    # >=0.2.0 — `clikit.config` без pydantic/pydantic-settings (#2710); `Field`
    # для `_HubAppConfig.permissions` теперь `clikit.config.Field`, не
    # `pydantic.Field`.
    "s-clikit>=0.2.0,<0.3",
    # >=0.3.3 — кит переведён на librarykit.proc (свои subprocess без окон),
    # .pkgsrc не течёт в зону агента, снапшот-установка помечается source="hub"
    # (без этого навык молча выпадал из автообновления, см. миграцию меты #1145).
    # >=0.3.4 обязательно: `core/_kit_config` импортирует `skillkit.telemetry`
    # (адаптер продукта над нейтральным s-telemetrykit), а в 0.3.3 модуля ещё
    # нет — на чистой установке резолвер взял бы 0.3.3 и CLI упал бы
    # ImportError'ом при первом же импорте.
    # #1221: учёт факта вызова навыка держится на ките >=0.3.5 — начиная с него
    # shim зовёт `skillery run --command <name> <slug> …`, и метрика перестаёт
    # зависеть от того, вспомнит ли модель позвать обёртку. Флор поднимется до
    # >=0.3.5 сразу ПОСЛЕ публикации кита на PyPI (иначе `uv lock` нечего
    # резолвить). На 0.3.4 всё продолжает работать: команды навыков зовутся
    # напрямую, просто без учёта, а миграция шимов молча становится no-op.
    # 0.4.1 — НИЖНЯЯ ГРАНИЦА НЕ СЛУЧАЙНА (#2542): в 0.4.0 протокол цели
    # переименовали, и совместимое имя не экспортировалось пакетом —
    # `skillery login` падал ImportError у всех, кто ставил свежий кит.
    # Раньше стояло >=0.3.7, и локально всё было зелено просто потому, что
    # новая версия не установлена. Поднимать границу вместе с китом.
    "s-skillkit>=0.4.1,<0.6",  # 0.3.7: владение артефактами — чужую команду/MCP не перехватить (#2272)
    "s-skillgate>=0.1.7,<0.2",  # единый secret-scan (G5): regex-fallback publish-гейта на skillgate; >=0.1.7: generic-password не блокирует код (getpass/передача переменной/JS-false)
    # >=0.1.2 — модуль telemetrykit.outbox: ОБЩИЙ локальный транспорт исходящих
    # сущностей (~/.skillery/outbox.jsonl). Навыки пишут туда kind="skill_run"
    # декоратором @track_skill(), CLI — kind="log"; доставку на /telemetry/batch
    # делает воркер демона (core/outbox_worker, #1174). Кит stdlib-only — веса
    # в зависимости CLI не добавляет.
    "s-telemetrykit>=0.2.0,<0.4",
    # #1490: ЕДИНСТВЕННЫЙ верификатор лиза способности — один и тот же код на
    # CLI и на gateway (контракт лиза §3.1, инвариант §10.3). Вторую реализацию
    # проверки подписи/срока заводить нельзя: две копии разъезжаются, и
    # разъезжаются в сторону «пускаем» — лишний пропуск не замечает никто.
    "s-leasekit>=0.1.2,<0.2",
]

# Все киты (s-librarykit/s-clikit/s-skillkit) тянутся с PyPI — CLI распространяем
# без локальных path-источников. s-skillkit>=0.1.5 несёт SkillkitConfig/configure
# (единая брендо-конфигурация: core/_kit_config задаёт бренд skillery одним
# вызовом — .skillery/skills.toml + legacy .skills-hub fallback). Заодно >=0.1.2
# гард BUG-3 (#272): пустой files-инвентарь не затирает стор при auto-update.

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

#: Инструменты прогона продублированы ГРУППОЙ (skl#2545): группу uv
#: синхронизирует сама, а extra требует явного `--extra dev` — забыли флаг,
#: и `uv run pytest` молча берёт СИСТЕМНЫЙ pytest с системными версиями
#: зависимостей, то есть проверяет не то окружение, которое собирается.
#: Extra `dev` НЕ удалён намеренно — на него ссылаются снаружи (.github/workflows/publish.yml, _worktrees/skillery-cli-wt-2282/.github/workflows/publish.yml),
#: ломать внешнего потребителя нельзя. Состав держим одинаковым.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[project.scripts]
skillery = "skillery_cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skillery_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
# Сторож окружения в conftest объясняет человеку по-русски, почему прогон
# идёт не из того интерпретатора: кириллица в прозе, а не в идентификаторах.
"tests/conftest.py" = ["RUF001"]
